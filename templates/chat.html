<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chatbot with AI + Voice</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .chat-box { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; background: #f9f9f9; border-radius: 4px; }
        .message { margin-bottom: 10px; }
        .me { font-weight: bold; color: blue; }
        .assistant { font-weight: bold; color: green; }
        #prompt { border: 1px solid #CCC; border-radius: 4px; height: 40px; padding: 0px 10px; }
        .prompt-box { margin-top: 10px; }
        .btn-prompt { border-radius: 4px; height: 40px; padding: 0px 14px; font-weight: 700; }
        .btn-prompt.send-message { background-color: #000; color: #FFF; border: 1px solid #000; }
        .btn-prompt.send-voice { background-color: orange; color: #000; border: 1px solid orange; }
    </style>
</head>
<body>
    <h2>Chat with AI</h2>
    <div class="chat-box" id="chat"></div>
    <div class="prompt-box">
        <input type="text" id="prompt" placeholder="Enter a message..." style="width:70%" onkeydown="enterKeyMessage(event)">
        <button class="btn-prompt send-message" onclick="sendMessage()">Send</button>
        <button class="btn-prompt send-voice" onclick="startVoice()">🎤 Voice</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat');

        function appendMessage(sender, text) {
            const msg = document.createElement('div');
            msg.classList.add('message');
            msg.innerHTML = `<span class="${sender}">${sender}:</span> ${text}`;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function enterKeyMessage(event) {
            if (event.key === "Enter") return sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('prompt');
            const message = input.value;
            if (!message) return;
            appendMessage('me', message);
            input.value = '';

            const res = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            
            speak(data.response); // text to speech

            appendMessage('assistant', data.response);
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng dùng Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('prompt').value = text;
            };

            recognition.start();
        }

        function detectLanguage(text) {
            return /[àáảãạâăêôơư]/i.test(text) ? 'vi-VN' : 'en-US';
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            // utter.lang = detectLanguage(text);
            utter.lang = "en-US";
            synth.speak(utter);
        }

        // function speak(text) {
        //     fetch("/speak", {
        //         method: "POST",
        //         headers: { "Content-Type": "application/json" },
        //         body: JSON.stringify({ text: text })
        //     })
        //     .then(res => res.json())
        //     .then(data => {
        //         const audio = new Audio(data.audio_url);
        //         audio.play();
        //     });
        // }
    </script>
</body>
</html>

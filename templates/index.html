<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chat với AI (GPT4All)</title>
</head>
<body>
    <h2>Nhập câu hỏi của bạn:</h2>
    <form method="POST">
        <textarea name="prompt" rows="4" cols="50" placeholder="Nhập câu hỏi..."></textarea><br><br>
        <input type="submit" value="Gửi">
    </form>

    {% if response %}
        <h3>Phản hồi từ AI:</h3>
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
